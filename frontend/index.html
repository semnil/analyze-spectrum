<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>analyze-spectrum</title>
  <script>
    // Resolve theme before CSS paints to prevent white flash
    (function() {
      var s = localStorage.getItem("spectrum-theme");
      var mode = (s === "light" || s === "dark") ? s : "auto";
      var resolved = mode === "auto"
        ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : mode;
      document.documentElement.setAttribute("data-theme", resolved);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/uPlot.min.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode"></button>
  <h1>Spectrum Analyzer</h1>

  <form id="analyze-form" class="input-bar">
    <input id="url-input" type="text" placeholder="YouTube URL or local file path">
    <button id="browse-btn" type="button" title="Browse local audio file">Browse</button>
    <button id="submit-btn" type="submit">Analyze</button>
    <button id="add-btn" type="button">+ Add Track</button>
    <button id="load-btn" type="button">Load JSON</button>
  </form>

  <div id="track-list"></div>
  <div id="compare-bar" class="compare-bar" style="display:none">
    <button id="clear-btn" type="button">Clear All</button>
  </div>

  <div id="status"></div>
  <div id="results"></div>

  <script src="vendor/uPlot.iife.min.js"></script>
  <script src="charts/spectrum.js"></script>
  <script src="charts/octave.js"></script>
  <script src="charts/transfer.js"></script>
  <script src="charts/lowend.js"></script>
  <script src="charts/midhigh.js"></script>
  <script src="main.js"></script>
</body>
</html>
