<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>analyze-spectrum</title>
  <script src="common/settings.js"></script>
  <script src="common/i18n.js"></script>
  <script src="i18n.js"></script>
  <script src="common/boot.js"></script>
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/uPlot.min.css">
</head>
<body>
  <header>
    <h1 data-i18n="app.title">Spectrum Analyzer</h1>
  </header>

  <main>
    <form id="analyze-form" class="input-bar" data-i18n-aria-label="form.aria" aria-label="Analyze audio source">
      <label for="url-input" class="visually-hidden" data-i18n="url.label">URL or local audio file path</label>
      <input id="url-input" type="text" placeholder="URL or local file path" data-i18n-placeholder="url.placeholder" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url">
      <button id="browse-btn" type="button" data-i18n-aria-label="btn.browse.aria" aria-label="Browse local audio file"><span data-i18n="btn.browse">Browse</span></button>
      <button id="submit-btn" type="submit">Analyze</button>
      <button id="add-btn" type="button" data-i18n="btn.add" data-i18n-aria-label="btn.add.aria" aria-label="Add another track for comparison">+ Add Track</button>
      <button id="load-btn" type="button" data-i18n-aria-label="btn.load_json.aria" aria-label="Load saved JSON result"><span data-i18n="btn.load_json">Load JSON</span></button>
    </form>

    <div id="track-list" role="list" data-i18n-aria-label="track_list.aria" aria-label="Tracks queued for comparison"></div>
    <div id="compare-bar" class="compare-bar" style="display:none">
      <button id="clear-btn" type="button" data-i18n="btn.clear" data-i18n-aria-label="btn.clear.aria" aria-label="Clear all queued tracks">Clear All</button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="results" tabindex="-1"></div>
  </main>

  <div class="toolbar">
    <button id="lang-toggle" class="lang-toggle" type="button" data-i18n-aria-label="lang.aria_toggle" aria-label="Switch language"></button>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme"></button>
  </div>

  <script src="vendor/uPlot.iife.min.js"></script>
  <script src="charts/spectrum.js"></script>
  <script src="charts/octave.js"></script>
  <script src="charts/transfer.js"></script>
  <script src="charts/lowend.js"></script>
  <script src="charts/midhigh.js"></script>
  <script src="common/ui.js"></script>
  <script src="common/update.js"></script>
  <script src="main.js"></script>
</body>
</html>
