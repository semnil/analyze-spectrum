name: ffmpeg watch
run-name: ffmpeg watch 🔭

# Turns a new osxexperts.net ffmpeg build into a patch release, merging its own pull requests without review.
#
# detect compares build_assets/ffmpeg.json with the osxexperts.net page (analyze_common.ffmpeg_release). When the
# page offers other Apple Silicon builds, it requires the same release series in the latest release of
# BtbN/FFmpeg-Builds, checks both macOS binaries against the page's SHA256 and keeps the new pin as an artifact.
# It also decides on a patch release: when __version__ equals the latest vX.Y.Z tag and either the pin changes now
# or the pin on master already differs from the one that tag released: the pin file at the tag, or, for a tag without
# it, the pin file as the first commit after the tag added it.
#
# smoke downloads the pin's binaries on macOS and Windows with build.py and runs tests/test_ffmpeg_binary.py on them.
#
# land lands up to two pull requests, one after the other: the new pin, then the version bump on its own. It pushes,
# opens and merges them with a token of the GitHub App whose client ID is the repository variable
# FFMPEG_WATCH_APP_CLIENT_ID and whose private key is the secret FFMPEG_WATCH_APP_PRIVATE_KEY, and it reads everything
# else with GITHUB_TOKEN. The pull request starts its own CI and dependabot-auto-merge.yml runs (pull_request) and its
# workflow-checks.yml run (pull_request_target); land waits for the three runs on the pull request's head commit and for
# its required checks, and merges. The merge of the bump starts CI on master, and the CI run of that push starts
# tag-release.yml, which tags the bump and starts release.yaml. When __version__ has no tag yet (the CI run of the
# bump's merge failed, for example), detect reports the commit that set it (release_sha) and land dispatches
# tag-release.yml with that. The draft Release is published by hand.
#
# An open pull request from an earlier run (head branch ffmpeg-watch/...) stops land before it changes anything. The
# branch names carry the run id and attempt, so a branch an earlier run pushed without opening its pull request does
# not collide with the next run's.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

concurrency:
  group: ffmpeg-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect 🔭
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    outputs:
      pin_update: ${{ steps.detect.outputs.pin_update }}
      bump: ${{ steps.detect.outputs.bump }}
      series: ${{ steps.detect.outputs.series }}
      version: ${{ steps.detect.outputs.version }}
      next_version: ${{ steps.detect.outputs.next_version }}
      release_sha: ${{ steps.detect.outputs.release_sha }}
    steps:
      - name: Check Ref ☑️
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/master ]]; then
            echo "::error::run this workflow on master, not ${GITHUB_REF}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Dependencies 📦
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compare the Pin with osxexperts.net 🔭
        id: detect
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: vendor/py-analyze-common/src
        run: |
          python -m analyze_common.ffmpeg_release detect \
            --pin build_assets/ffmpeg.json \
            --version-file src/analyze_spectrum/__init__.py \
            --candidate "${RUNNER_TEMP}/ffmpeg.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Upload the New Pin 📡
        if: steps.detect.outputs.pin_update == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-pin
          path: ${{ runner.temp }}/ffmpeg.json
          if-no-files-found: error

  smoke:
    name: Test the Binaries on ${{ matrix.os }} 🧪
    needs: detect
    if: needs.detect.outputs.pin_update == 'true' || needs.detect.outputs.bump == 'true' || needs.detect.outputs.release_sha != ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set Up Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Dependencies 📦
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Download the New Pin 📥
        if: needs.detect.outputs.pin_update == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-pin
          path: build_assets

      - name: Download ffmpeg 📥
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python build.py --ffmpeg-only

      - name: Run the App's Parsers on It 🧪
        env:
          EXPECT_FFMPEG_DIR: build_assets/bin
        run: python -m pytest -q tests/test_ffmpeg_binary.py

  land:
    name: Land the Pin and the Bump 🛬
    needs: [detect, smoke]
    if: needs.detect.outputs.pin_update == 'true' || needs.detect.outputs.bump == 'true' || needs.detect.outputs.release_sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # the App's token pushes the branches and merges
      pull-requests: read # find the open pull requests and the one land opened
      checks: read # gh pr checks
      statuses: read # gh pr checks
      actions: write # find the pull requests' runs and dispatch tag-release.yml with release_sha
    defaults:
      run:
        shell: bash
    steps:
      - name: Create the App's Token 🔑
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FFMPEG_WATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.FFMPEG_WATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Download the New Pin 📥
        if: needs.detect.outputs.pin_update == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-pin
          path: ${{ runner.temp }}/pin

      - name: Land 🛬
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PIN_UPDATE: ${{ needs.detect.outputs.pin_update }}
          BUMP: ${{ needs.detect.outputs.bump }}
          SERIES: ${{ needs.detect.outputs.series }}
          VERSION: ${{ needs.detect.outputs.version }}
          NEXT_VERSION: ${{ needs.detect.outputs.next_version }}
          RELEASE_SHA: ${{ needs.detect.outputs.release_sha }}
          CANDIDATE: ${{ runner.temp }}/pin/ffmpeg.json
        run: |
          : Land the Pin and the Bump
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          set -euo pipefail

          version_file=src/analyze_spectrum/__init__.py
          pin_file=build_assets/ffmpeg.json
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          open=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("ffmpeg-watch/")) | "#\(.number)"] | join(" ")')
          if [[ -n "${open}" ]]; then
            echo "::error::pull requests from an earlier run are still open: ${open}"
            exit 1
          fi

          bot_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          if ! [[ "${bot_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::could not read the user id of ${APP_SLUG}[bot] (got '${bot_id}')"
            exit 1
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          # find_run <workflow> <event> <commit>: the newest <event> run of <workflow> on <commit>.
          find_run() {
            local workflow="$1" event="$2" commit="$3" id
            for _ in $(seq 36); do
              id=$(gh run list --workflow "${workflow}" --event "${event}" --commit "${commit}" --limit 1 \
                --json databaseId --jq '.[0].databaseId // empty')
              if [[ -n "${id}" ]]; then
                echo "${id}"
                return 0
              fi
              sleep 5
            done
            echo "::error::no ${event} run of ${workflow} on ${commit} appeared" >&2
            return 1
          }

          # start <branch>: a new branch at the tip of master.
          start() {
            git fetch --quiet origin master
            git switch --quiet --create "$1" FETCH_HEAD
          }

          # land <branch> <title> <body> <path>...: commit the paths, push them and open the pull request with the App's
          # token, wait for the pull request's runs and required checks, and merge it with the App's token.
          land() {
            local branch="$1" title="$2" body="$3" sha pr ci automerge pins
            shift 3
            git add -- "$@"
            git commit --quiet -m "${title}"
            sha=$(git rev-parse HEAD)
            git push --quiet origin "HEAD:refs/heads/${branch}"
            GH_TOKEN="${APP_TOKEN}" gh pr create --base master --head "${branch}" --title "${title}" --body "${body}" > /dev/null
            pr=$(gh pr view "${branch}" --json number --jq .number)
            echo "opened #${pr}: ${title}"
            ci=$(find_run ci.yaml pull_request "${sha}")
            automerge=$(find_run dependabot-auto-merge.yml pull_request "${sha}")
            pins=$(find_run workflow-checks.yml pull_request_target "${sha}")
            gh run watch "${ci}" --exit-status --compact --interval 30
            gh run watch "${automerge}" --exit-status --compact --interval 15
            gh run watch "${pins}" --exit-status --compact --interval 15
            gh pr checks "${pr}" --required
            GH_TOKEN="${APP_TOKEN}" gh pr merge "${pr}" --merge --match-head-commit "${sha}"
            echo "merged #${pr}"
          }

          if [[ "${PIN_UPDATE}" == true ]]; then
            branch="ffmpeg-watch/pin-${SERIES}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            start "${branch}"
            cp "${CANDIDATE}" "${pin_file}"
            diff=$(git diff -- "${pin_file}")
            fence=$(printf '\140\140\140')
            body=$(printf '%s\n\n%sdiff\n%s\n%s\n\n%s\n' \
              "Update the bundled ffmpeg / ffprobe to the Apple Silicon build on osxexperts.net and the ${SERIES} series of BtbN/FFmpeg-Builds. The two macOS files were checked against the SHA256 on the page, and the files fetched on both OSes passed tests/test_ffmpeg_binary.py." \
              "${fence}" "${diff}" "${fence}" "${run_url}")
            land "${branch}" "build: update the bundled ffmpeg to ${SERIES}" "${body}" "${pin_file}"
          fi

          if [[ "${BUMP}" == true ]]; then
            branch="ffmpeg-watch/bump-v${NEXT_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            start "${branch}"
            read_version() { sed -n 's/^__version__ = "\(.*\)"$/\1/p' "${version_file}"; }
            current=$(read_version)
            if [[ "${current}" != "${VERSION}" ]]; then
              echo "::error::__version__ on master is ${current}, not ${VERSION} as detect read it — not bumping"
              exit 1
            fi
            sed -i "s/^__version__ = \"${VERSION}\"$/__version__ = \"${NEXT_VERSION}\"/" "${version_file}"
            if [[ "$(read_version)" != "${NEXT_VERSION}" ]]; then
              echo "::error::could not write __version__ = \"${NEXT_VERSION}\" to ${version_file}"
              exit 1
            fi
            body=$(printf '%s\n\n%s\n' "Patch release that bundles ffmpeg ${SERIES}. It contains only the version bump." "${run_url}")
            land "${branch}" "chore: update the version to v${NEXT_VERSION}" "${body}" "${version_file}"
            echo "the CI run of the merge on master starts tag-release.yml for v${NEXT_VERSION}"
          elif [[ -n "${RELEASE_SHA}" ]]; then
            gh workflow run tag-release.yml --ref master -f sha="${RELEASE_SHA}"
            echo "dispatched tag-release.yml with ${RELEASE_SHA} for v${VERSION}"
          fi
