name: Release
run-name: ${{ github.ref_name }} release build 🚀

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-event:
    name: Check Release Tag ☑️
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      validTag: ${{ steps.check.outputs.validTag }}
    steps:
      - name: Check Tag ☑️
        id: check
        run: |
          : Check Release Tag
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          # A tag push, or a dispatch on a tag ref (tag-release.yml), releases.
          if [[ "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            echo 'validTag=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${GITHUB_REF_NAME#v}"
          case "${tag}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> "$GITHUB_OUTPUT"
              echo 'prerelease=false' >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc|alpha)*([0-9.]) )
              echo 'validTag=true' >> "$GITHUB_OUTPUT"
              echo 'prerelease=true' >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'validTag=false' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build-windows:
    name: Build for Windows 🪟
    needs: check-event
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Set Up Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Inno Setup 🔧
        run: choco install innosetup --no-progress -y

      - name: Install Dependencies 📦
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"
          pip install pyinstaller

      - name: Build Installer 🧱
        run: python build.py --installer
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Test the Bundled ffmpeg 🧪
        env:
          EXPECT_FFMPEG_DIR: dist/analyze-spectrum/_internal/bin
        run: python -m pytest -q tests/test_ffmpeg_binary.py

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analyze-spectrum-windows-x64
          path: |
            installer_output/*.exe
          if-no-files-found: error

  build-macos:
    name: Build for macOS 🍏
    needs: check-event
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Set Up Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install create-dmg 🔧
        run: brew install create-dmg

      - name: Install Dependencies 📦
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"
          pip install pyinstaller

      - name: Generate .icns from iconset 🎨
        run: |
          if [ -d build_assets/icon.iconset ]; then
            iconutil -c icns build_assets/icon.iconset -o build_assets/icon.icns
          fi

      - name: Check Signing Secrets 🔑
        id: check-signing
        env:
          CERT: ${{ secrets.MACOS_SIGNING_CERT }}
        run: |
          if [[ -n "$CERT" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_SIGNING_CERT not set — building unsigned DMG"
          fi

      - name: Build .app Bundle 🧱
        run: python build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Runs right before Codesign .app, which deletes the keychain when it ends. Only codesign may use the key.
      - name: Import Apple Developer ID Certificate 🔑
        if: steps.check-signing.outputs.signed == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo -n "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"

          rm "$RUNNER_TEMP/cert.p12"

          echo '--- Signing identities ---'
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Codesign .app 🔏
        if: steps.check-signing.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          trap 'security delete-keychain "$KEYCHAIN_PATH"' EXIT
          APP="dist/Spectrum Analyzer.app"
          IDENTITY=$(security find-identity -v -p codesigning | \
            grep "Developer ID Application" | head -1 | \
            sed -E 's/.*"([^"]+)".*/\1/')
          echo "Signing with identity: $IDENTITY"

          cat > /tmp/entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
            <key>com.apple.security.cs.allow-dyld-environment-variables</key><true/>
          </dict>
          </plist>
          PLIST

          # Sign every Mach-O file inside the bundle (nested tools, dylibs, .so).
          # Entitlements are only for the main executable; nested binaries get
          # hardened runtime without the JIT / library-validation exceptions.
          find "$APP" -type f | while read -r f; do
            if file "$f" 2>/dev/null | grep -q "Mach-O"; then
              codesign --force --timestamp --options runtime \
                --sign "$IDENTITY" "$f"
            fi
          done

          # Main executable with entitlements
          codesign --force --timestamp --options runtime \
            --entitlements /tmp/entitlements.plist \
            --sign "$IDENTITY" "$APP/Contents/MacOS/analyze-spectrum"

          # Finally the bundle itself
          codesign --force --timestamp --options runtime \
            --entitlements /tmp/entitlements.plist \
            --sign "$IDENTITY" "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Test the Bundled ffmpeg 🧪
        env:
          EXPECT_FFMPEG_DIR: dist/Spectrum Analyzer.app/Contents/Frameworks/bin
        run: python -m pytest -q tests/test_ffmpeg_binary.py

      - name: Build DMG 💿
        run: python build.py --installer --skip-download --skip-build

      - name: Notarize DMG 📮
        if: steps.check-signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          set -e
          DMG=installer_output/Spectrum-Analyzer.dmg

          SUBMIT_JSON=$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json)
          echo "--- Submit response ---"
          echo "$SUBMIT_JSON"

          SUBMIT_ID=$(echo "$SUBMIT_JSON" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          STATUS=$(echo "$SUBMIT_JSON" | python3 -c "import json,sys;print(json.load(sys.stdin)['status'])")

          echo "--- Notarization log ($SUBMIT_ID) ---"
          xcrun notarytool log "$SUBMIT_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" || true

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization status: $STATUS"
            exit 1
          fi

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analyze-spectrum-macos
          path: |
            installer_output/*.dmg
          if-no-files-found: error

  create-release:
    name: Create Release 🛫
    needs: [check-event, build-windows, build-macos]
    if: needs.check-event.outputs.validTag == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Set Up Python 🐍
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # The manifest tool imports the app's UpdateConfig from src/ and analyze_common, which imports yt-dlp.
      # This job installs only that yt-dlp, at the version pyproject.toml pins, without its dependencies.
      - name: Install Dependencies 📦
        timeout-minutes: 10
        run: |
          pin=$(python -c 'import tomllib; print(next(d for d in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"] if d.startswith("yt-dlp==")))')
          python -m pip install --no-deps "${pin}"

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      # latest.json is what the in-app update reads from the latest release.  Each
      # installer's signature is checked against PUBLIC_KEY in
      # src/analyze_spectrum/update.py before the file is written, so a release
      # signed with a key the installed apps do not hold fails here instead.
      - name: Sign Update Manifest 🔏
        timeout-minutes: 5
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: ${{ needs.check-event.outputs.version }}
          PYTHONPATH: src:vendor/py-analyze-common/src
        run: |
          if [[ -z "${UPDATE_SIGNING_KEY}" ]]; then
            echo "::error::UPDATE_SIGNING_KEY is not set; without latest.json no installed app can update to this release"
            exit 1
          fi
          key="${RUNNER_TEMP}/update-signing-key.pem"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s\n' "${UPDATE_SIGNING_KEY}" > "${key}")
          exes=(artifacts/SpectrumAnalyzer-*-setup.exe)
          if (( ${#exes[@]} != 1 )) || [[ ! -f "${exes[0]}" ]]; then
            echo "::error::expected one Windows installer in artifacts/, found: ${exes[*]}"
            exit 1
          fi
          python -m analyze_common.update_manifest sign \
            --config analyze_spectrum.update:UPDATE_CONFIG \
            --tag "${TAG}" --key "${key}" --out artifacts/latest.json \
            "windows-x86_64=${exes[0]}" \
            darwin-aarch64=artifacts/Spectrum-Analyzer.dmg
          cat artifacts/latest.json

      - name: Create Release 🛫
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564 # v2.0.4
        with:
          draft: true
          prerelease: ${{ needs.check-event.outputs.prerelease == 'true' }}
          tag_name: ${{ needs.check-event.outputs.version }}
          name: ${{ needs.check-event.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/latest.json
