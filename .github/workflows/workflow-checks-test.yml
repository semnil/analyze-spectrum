name: Workflow checks test

# Runs .github/tests/workflow-checks-test.sh, which executes the steps of workflow-checks.yml from this commit against fixture
# git trees served by a fake gh and asserts which fixtures pass and which fail with which reason, and
# .github/tests/dependabot-auto-merge-test.sh, which checks that dependabot-auto-merge.yml reports on every pull request and which updates it auto-merges,
# .github/tests/tag-release-test.sh, which runs the tag step of tag-release.yml against a fixture repository, and
# .github/tests/ffmpeg-watch-land-test.sh, which runs the land step of ffmpeg-watch.yml against a fixture repository.
on:
  pull_request:
    paths:
      - .github/workflows/workflow-checks.yml
      - .github/workflows/workflow-checks-test.yml
      - .github/tests/workflow-checks-test.sh
      - .github/workflows/dependabot-auto-merge.yml
      - .github/tests/dependabot-auto-merge-test.sh
      - .github/workflows/tag-release.yml
      - .github/tests/tag-release-test.sh
      - .github/workflows/ffmpeg-watch.yml
      - .github/tests/ffmpeg-watch-land-test.sh
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/workflow-checks.yml
      - .github/workflows/workflow-checks-test.yml
      - .github/tests/workflow-checks-test.sh
      - .github/workflows/dependabot-auto-merge.yml
      - .github/tests/dependabot-auto-merge-test.sh
      - .github/workflows/tag-release.yml
      - .github/tests/tag-release-test.sh
      - .github/workflows/ffmpeg-watch.yml
      - .github/tests/ffmpeg-watch-land-test.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-checks-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the workflow check against fixtures
        run: bash .github/tests/workflow-checks-test.sh
      - name: Run the auto-merge workflow test
        run: bash .github/tests/dependabot-auto-merge-test.sh
      - name: Run the tag release workflow test
        run: bash .github/tests/tag-release-test.sh
      - name: Run the ffmpeg watch land test
        run: bash .github/tests/ffmpeg-watch-land-test.sh
