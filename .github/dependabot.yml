version: 2
updates:
  # The workflow actions. Actions are SHA-pinned with a version comment
  # (`@<sha> # vX.Y.Z`); Dependabot bumps the pin and comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
  # vendor/py-analyze-common, moved to the newest commit of its default branch.
  # The entry is excluded from Dependabot's default cooldown, so a commit is
  # offered on the next daily run.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    cooldown:
      exclude:
        - "*"
  # pyproject.toml and the uv pip compile output in requirements/. A version is
  # offered three days after its release (Dependabot's default cooldown).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    # pyee is a transitive dependency of playwright, which requires pyee<15.
    # Skip isolated pyee bumps; pyee still moves when a playwright update
    # re-resolves requirements/release.txt.
    ignore:
      - dependency-name: "pyee"
