[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analyze-spectrum"
dynamic = ["version"]
description = "Audio spectral analysis tool"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "yt-dlp==2026.10.21",  # pinned per release; mirrored in py-analyze-common
    "yt-dlp-ejs==0.8.0",  # the YouTube challenge solver scripts yt-dlp reads; the version of yt-dlp's "pin" extra
]

[project.optional-dependencies]
gui = [
    "pywebview>=5.0",
    "certifi",  # CA bundle for the update check (analyze_common.update)
]
dev = [
    "pytest>=8.0",
    "playwright>=1.40",
    "pyinstaller>=6.0",
    "pywebview>=5.0",
    "uv",
]

[project.scripts]
analyze-spectrum = "analyze_spectrum.cli:main"

[project.gui-scripts]
analyze-spectrum-gui = "analyze_spectrum.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "analyze_spectrum.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
