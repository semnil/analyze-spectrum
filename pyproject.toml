[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analyze-spectrum"
version = "0.9.1"
description = "Audio spectral analysis tool"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
gui = [
    "pywebview>=5.0",
]
dev = [
    "pytest>=8.0",
    "playwright>=1.40",
    "pyinstaller>=6.0",
    "pywebview>=5.0",
]

[project.scripts]
analyze-spectrum = "analyze_spectrum.cli:main"

[project.gui-scripts]
analyze-spectrum-gui = "analyze_spectrum.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
